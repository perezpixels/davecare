<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DavidCare pharmacy patient engagement">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DavidCare">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>DavidCare</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #faf8ff;
      font-family: "Segoe UI", Inter, sans-serif;
      color: #131b2e;
    }
    #boot {
      min-height: 100%;
      display: flex;
      flex-direction: column;

<body>
  <div id="boot">
    <div class="mark"></div>
    <strong>DavidCare</strong>
    <p>Loading the pharmacy app… this can take a minute in debug Chrome.</p>
